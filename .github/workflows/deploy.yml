name: Veröffentlichen (SFTP)

# Lädt die gebaute Website per SFTP auf den Webspace (z. B. IONOS-Webhosting).
# Läuft nur von Hand ("Run workflow"), damit nichts versehentlich live geht.
# Benötigte Repository-Secrets: SFTP_HOST, SFTP_USER, SFTP_PASSWORD, SFTP_PATH (z. B. /).

on:
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Upload per SFTP
        env:
          SFTP_HOST: ${{ secrets.SFTP_HOST }}
          SFTP_USER: ${{ secrets.SFTP_USER }}
          SFTP_PASSWORD: ${{ secrets.SFTP_PASSWORD }}
          SFTP_PATH: ${{ secrets.SFTP_PATH }}
        run: |
          if [ -z "$SFTP_HOST" ]; then echo "SFTP-Secrets fehlen, Abbruch."; exit 1; fi
          sudo apt-get update -qq && sudo apt-get install -y -qq lftp
          lftp -u "$SFTP_USER","$SFTP_PASSWORD" "sftp://$SFTP_HOST" -e "
            set sftp:auto-confirm yes;
            mirror --reverse --delete --verbose --exclude-glob .git* dist/ ${SFTP_PATH:-/};
            bye"
