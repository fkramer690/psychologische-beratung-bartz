name: Build und Prüfung

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Offene Platzhalter auflisten
        run: npm run check:todos
      - uses: actions/upload-artifact@v4
        with:
          name: website
          path: dist/
          retention-days: 14
